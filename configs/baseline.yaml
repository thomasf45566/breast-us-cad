data:
  root: data/raw/busbra
  img_size: 224
  batch_size: 32
  num_workers: 4
  train_folds: [1, 2, 3, 4]
  val_folds: [5]

model:
  name: efficientnet_b0
  pretrained: true

train:
  epochs: 30
  optimizer: adamw
  scheduler: cosine
  loss: bce_with_logits
  pos_weight: auto   # auto = n_benign / n_malignant over the train folds; or a number
  lr: 3.0e-4
  weight_decay: 1.0e-4
  seed: 42
  device: mps

wandb:
  project: breast-us-cad
  run_name: baseline_effb0

paths:
  ckpt: models/best.pt
  reports_dir: reports
