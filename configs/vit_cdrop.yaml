data:
  root: data/raw/busbra
  img_size: 224   # must stay 224 for vit_base_patch16_224
  batch_size: 32
  num_workers: 4
  train_folds: [1, 2, 3, 4]
  val_folds: [5]
  coarse_dropout:   # train transforms only; fill = per-image mean
    min_holes: 2
    max_holes: 4
    hole_size: 32
    p: 0.5

model:
  name: vit_base_patch16_224
  pretrained: true

train:
  epochs: 30
  optimizer: adamw
  scheduler: cosine
  loss: bce_with_logits
  pos_weight: auto
  lr: 1.0e-4
  warmup_epochs: 3   # linear warmup (0.1x -> 1x lr) before cosine; ViT is warmup-sensitive
  weight_decay: 1.0e-4
  seed: 42
  device: mps

wandb:
  project: breast-us-cad
  run_name: vit_b16_fold5

paths:
  ckpt: models/vit_b16_fold5.pt
  reports_dir: reports
